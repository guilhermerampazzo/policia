# ============================================================
# FORJA v2 — stack Docker
# Única porta exposta: ${PORT_EXTERNA} (padrão 10333) → app :3000
# Postgres fica em rede interna (NÃO expõe porta no host).
# Uso:  cp .env.example .env  →  docker compose up -d --build
# ============================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forja}
      POSTGRES_USER: ${POSTGRES_USER:-forja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forja_segredo_troque}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forja} -d ${POSTGRES_DB:-forja}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - forja

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DATABASE_URL sempre aponta para o host interno "db" — não usa a
      # variável local do .env (que pode apontar para outro Postgres).
      DATABASE_URL: postgresql://${POSTGRES_USER:-forja}:${POSTGRES_PASSWORD:-forja_segredo_troque}@db:5432/${POSTGRES_DB:-forja}?schema=public
      SESSION_PASSWORD: ${SESSION_PASSWORD}
      MINDMAP_API_KEY: ${MINDMAP_API_KEY:-}
      MINDMAP_BASE_URL: ${MINDMAP_BASE_URL:-https://omni.codermaster.com.br/v1/}
      MINDMAP_MODEL: ${MINDMAP_MODEL:-agy/gemini-3.6-flash-high}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://opencode.ai/zen/go/v1/}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@forja.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-forja1234}
      SEED_ALUNO_EMAIL: ${SEED_ALUNO_EMAIL:-aluno@forja.com}
      SEED_ALUNO_PASSWORD: ${SEED_ALUNO_PASSWORD:-forja1234}
    ports:
      - "${PORT_EXTERNA:-10333}:3000"
    networks:
      - forja

volumes:
  pgdata:

networks:
  forja:
    driver: bridge
